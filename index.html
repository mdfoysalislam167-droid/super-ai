<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MY SUPER AI - Never No</title>
  <link rel="icon" href="logo.png">
<style>
body{background:#0a0a0a;color:#fff;font-family:sans-serif;margin:0;padding:15px}
h1{text-align:center;color:#00ff88;text-shadow:0 0 10px #00ff88}
.tab{display:flex;gap:10px;margin:15px 0}
.tab button{flex:1;padding:12px;border:none;border-radius:10px;background:#1f1f1f;color:#fff;font-weight:bold}
.tab button.active{background:#00ff88;color:#000}
.box{background:#1a1a1a;padding:15px;border-radius:15px;display:none}
.box.active{display:block}
input,textarea{width:100%;padding:12px;border-radius:10px;border:none;background:#2a2a2a;color:#fff;margin:8px 0;box-sizing:border-box}
.btn{width:100%;padding:12px;background:#00ff88;color:#000;font-weight:bold;border:none;border-radius:10px;margin-top:10px}
.chat{height:300px;overflow-y:auto;background:#111;padding:10px;border-radius:10px;margin-bottom:10px}
.msg{margin:8px 0;padding:10px;border-radius:10px}
.user{background:#00ff88;color:#000;text-align:right}
.ai{background:#2a2a2a}
</style>
</head>
<body>
<h1>🤖 MY SUPER AI</h1>
<p style="text-align:center;color:#aaa">আমি কখনো না বলবো না, বস!</p>

<div class="tab">
<button class="active" onclick="openTab('ai')">আমার AI</button>
<button onclick="openTab('down')">ডাউনলোডার</button>
<button onclick="openTab('help')">হেল্পার</button>
</div>

<div id="ai" class="box active">
<div id="chat" class="chat"><div class="msg ai">বস, বলো কি করতে হবে? আমি রেডি! 🔥</div></div>
<input id="q" placeholder="যা খুশি লেখো বস...">
<button class="btn" onclick="askAI()">পাঠাও</button>
</div>

<div id="down" class="box">
<h3>📥 সুপার ডাউনলোডার</h3>
<input id="link" placeholder="ফাইলের লিংক পেস্ট করো... যেমন https://...">
<button class="btn" onclick="downloadFile()">ডাউনলোড করো</button>
<p id="dstatus" style="color:#00ff88"></p>
</div>

<div id="help" class="box">
<h3>🛠️ যা বলবে তাই করবো</h3>
<textarea id="task" rows="4" placeholder="যেমন: আমার জন্য একটা CV বানিয়ে দাও..."></textarea>
<button class="btn" onclick="doTask()">করে দাও বস</button>
<div id="result" style="margin-top:15px;background:#111;padding:10px;border-radius:10px"></div>
</div>

<script>
function openTab(id){
document.querySelectorAll('.box').forEach(b=>b.classList.remove('active'));
document.querySelectorAll('.tab button').forEach(b=>b.classList.remove('active'));
document.getElementById(id).classList.add('active');
event.target.classList.add('active');
}

function askAI(){
let input=document.getElementById('q');
let text=input.value.trim();
if(!text) return;
let chat=document.getElementById('chat');
chat.innerHTML+=`<div class="msg user">${text}</div>`;
input.value='';

let reply="";
if(text.toLowerCase().includes("কে তুমি")) reply="আমি তোমার নিজের AI, বস! তোমার জন্য বানানো, আমি কখনো না বলবো না।";
else if(text.toLowerCase().includes("download")) reply="বস, ডাউনলোডার ট্যাবে যাও, লিংক দাও, আমি এখনই নামিয়ে দিচ্ছি!";
else reply=`হ্যাঁ বস, হয়ে যাবে! তুমি বলেছো: "${text}" — এটা আমি করে দিচ্ছি। তুমি চাইলে আমি এটার জন্য কোড, প্ল্যান, বা পুরো লেখা বানিয়ে দিতে পারি। আর কি যোগ করবো বলো?`;

setTimeout(()=>{
chat.innerHTML+=`<div class="msg ai">${reply}</div>`;
chat.scrollTop=chat.scrollHeight;
},500);
}

function downloadFile(){
let url=document.getElementById('link').value.trim();
if(!url){alert("লিংক দাও বস!");return;}
document.getElementById('dstatus').innerText="ডাউনলোড শুরু হচ্ছে...";
let a=document.createElement('a');
a.href=url;
a.download='';
a.target='_blank';
a.click();
document.getElementById('dstatus').innerText="✅ লিংক খুলে দিয়েছি বস, ব্রাউজার থেকেই সেভ করে নাও!";
}

function doTask(){
let t=document.getElementById('task').value;
if(!t) return;
document.getElementById('result').innerHTML=`<b style="color:#00ff88">হ্যাঁ বস, করে দিচ্ছি:</b><br><br>${t}<br><br>👉 এটার জন্য আমি পুরো প্ল্যান বানিয়ে দিলাম। তুমি বললে আমি এখনই কোড/লেখা বানিয়ে দেবো। আমি কখনো না বলবো না!`;
}
</script>
</body>
</html>
