<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MY AI - FINAL</title>
<style>body{background:#000;color:#fff;font-family:sans-serif;padding:10px;margin:0}h1{color:#00ff88;text-align:center}#chat{height:75vh;overflow:auto;background:#111;padding:10px;border-radius:10px;border:1px solid #00ff88}.msg{padding:10px;margin:6px 0;border-radius:10px}.user{background:#00ff88;color:#000;margin-left:auto;width:fit-content;max-width:80%}.ai{background:#222}.row{display:flex;gap:5px;margin-top:10px}input{flex:1;padding:12px;border-radius:10px;border:0;background:#222;color:#fff}button{padding:12px 18px;background:#00ff88;border:0;border-radius:10px;font-weight:bold}</style>
</head>
<body>
<h1>MY SUPER AI ✅</h1>
<div id="chat"><div class="msg ai">Boss, আমি রেডি! এখন লিখো, আর লিমিট আসবে না।</div></div>
<div class="row"><input id="input" placeholder="লিখো..."><button onclick="ask()">SEND</button></div>
<script>
async function ask(){
let inp=document.getElementById('input');let txt=inp.value.trim();if(!txt)return;
let chat=document.getElementById('chat');chat.innerHTML+=`<div class="msg user">${txt}</div>`;inp.value='';
let id=Date.now();chat.innerHTML+=`<div class="msg ai" id="${id}">...</div>`;chat.scrollTop=chat.scrollHeight;
try{
let res=await fetch('https://text.pollinations.ai/'+encodeURIComponent(txt)+'?model=mistral');
let data=await res.text();
document.getElementById(id).innerText=data;
}catch(e){document.getElementById(id).innerText="Boss আবার SEND চাপো, নেট একটু স্লো!";}
chat.scrollTop=chat.scrollHeight;
}
document.getElementById('input').addEventListener('keydown',e=>{if(e.key==='Enter')ask()});
</script>
</body>
</html>
