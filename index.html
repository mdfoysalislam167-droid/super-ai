<!DOCTYPE html>
<html>
<body style="background:#000;color:#fff;font-family:sans-serif;padding:15px">
<h2 style="color:#0f0">Super AI - Final</h2>
<div id="a" style="background:#222;padding:10px;height:70vh;overflow:auto"></div>
<input id="q" style="width:70%;padding:12px" placeholder="লেখো...">
<button onclick="go()" style="padding:12px;background:#0f0">SEND</button>
<script>
async function go(){
let Q=document.getElementById('q').value;
let A=document.getElementById('a');
A.innerHTML+=`<div style="color:#0f0">You: ${Q}</div>`;
document.getElementById('q').value='';
A.innerHTML+=`<div id="x">AI ভাবছে...</div>`;
let res=await fetch('https://text.pollinations.ai/'+encodeURIComponent(Q));
let txt=await res.text();
document.getElementById('x').id='';
A.innerHTML+=`<div>AI: ${txt}</div>`;
A.scrollTop=A.scrollHeight;
}
</script>
</body>
</html>
