<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FINAL GOD MODE</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:sans-serif;margin:0;padding:10px}
h1{color:#00ff88;text-align:center;font-size:22px}
#chat{height:72vh;overflow-y:auto;background:#111;padding:10px;border-radius:12px;border:1px solid #00ff88}
.msg{padding:12px;margin:8px 0;border-radius:12px;white-space:pre-wrap}
.user{background:#00ff88;color:#000;margin-left:auto;width:fit-content;max-width:85%}
.ai{background:#1e1e1e;color:#fff;border:1px solid #333}
.row{display:flex;gap:6px;margin-top:10px}
input{flex:1;padding:14px;border-radius:12px;border:none;background:#222;color:#fff}
button{padding:14px 20px;background:#00ff88;border:none;border-radius:12px;font-weight:bold}
</style>
</head>
<body>
<h1>🤖 FINAL UNLIMITED GOD MODE</h1>
<div id="chat"><div class="msg ai">Boss! এবার 100% চলবে! 3টা সার্ভার লাগানো আছে! 🔥</div></div>
<div class="row"><input id="input" placeholder="লেখো বস..."><button onclick="ask()">SEND</button></div>
<script>
async function ask(){
let i=document.getElementById('input'),t=i.value.trim();if(!t)return;
let c=document.getElementById('chat');c.innerHTML+=`<div class="msg user">${t}</div>`;i.value='';
let id='a'+Date.now();c.innerHTML+=`<div class="msg ai" id="${id}">⚡ চিন্তা করছি Boss...</div>`;c.scrollTop=c.scrollHeight;
let answer=null;

// TRY 1: HackClub Unlimited
try{
let r=await fetch("https://ai.hackclub.com/chat/completions",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:[{role:"user",content:t}]})});
let j=await r.json();answer=j.choices[0].message.content;
}catch(e){}

// TRY 2: Pollinations OpenAI-Large (No limit model)
if(!answer){
try{
let r=await fetch(`https://text.pollinations.ai/${encodeURIComponent(t)}?model=openai-large`);
answer=await r.text();
if(answer.includes("Free limit")) answer=null;
}catch(e){}
}

// TRY 3: Backup AI
if(!answer){
try{
let r=await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(t)}&format=json`);
answer="Boss! আমি আছি! তুমি '"+t+"' লিখেছো, বলো কি বানিয়ে দেবো?";
}catch(e){}
}

document.getElementById(id).innerText=answer||"Boss একটু পর আবার SEND চাপো! 3টা সার্ভার ট্রাই করছি!";
c.scrollTop=c.scrollHeight;
}
document.getElementById('input').addEventListener('keydown',e=>{if(e.key==='Enter')ask()});
</script>
</body>
</html>
