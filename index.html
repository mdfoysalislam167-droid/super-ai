<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super AI</title>
<style>
body{background:#000;color:#fff;font-family:Arial;padding:10px;height:100vh;display:flex;flex-direction:column}
h1{color:#00ff88;text-align:center;padding:12px}
#chat{flex:1;background:#111;border:1px solid #00ff88;border-radius:12px;padding:12px;overflow-y:auto}
.msg{padding:10px;margin:8px 0;border-radius:10px;max-width:85%;white-space:pre-wrap}
.user{background:#00ff88;color:#000;margin-left:auto}
.ai{background:#222}
#box{display:flex;gap:8px;margin-top:10px}
#input{flex:1;padding:14px;border-radius:10px;border:none;background:#222;color:#fff}
#btn{padding:14px 20px;background:#00ff88;border:none;border-radius:10px;font-weight:bold}
</style>
</head>
<body>
<h1>🤖 Super AI - No Login</h1>
<div id="chat"><div class="msg ai">Boss রেডি! 🔥</div></div>
<div id="box"><input id="input" placeholder="লেখো..."><button id="btn" onclick="send()">SEND</button></div>
<script>
const chat=document.getElementById('chat'),input=document.getElementById('input');
async function send(){
const t=input.value.trim();if(!t)return;
chat.innerHTML+=`<div class="msg user">${t}</div>`;input.value='';
const d=document.createElement('div');d.className='msg ai';d.textContent='...';chat.appendChild(d);chat.scrollTop=99999;
try{let r=await fetch('https://text.pollinations.ai/'+encodeURIComponent(t));let txt=await r.text();d.textContent=txt;}catch(e){d.textContent='আবার SEND দাও!';}
chat.scrollTop=99999;
}
input.addEventListener('keydown',e=>{if(e.key==='Enter')send()});
</script>
</body>
  </html>
